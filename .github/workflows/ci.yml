name: CI

on:
  pull_request:
    paths-ignore:
      - 'themes/**'
      - 'overrides/**'
      - 'state/**'
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'scripts/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
