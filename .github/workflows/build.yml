name: Build catalog

on:
  push:
    branches: [master]
    paths:
      - 'themes/**'
      - 'overrides/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '23 */6 * * *' # every 6 h — refresh stars, HEAD, liveness
  workflow_dispatch:

concurrency:
  group: build-catalog
  cancel-in-progress: false

permissions:
  contents: write # commit state/liveness.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .work
          key: catalog-work-${{ github.run_id }}
          restore-keys: |
            catalog-work-

      - run: pnpm install --frozen-lockfile

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: pnpm build

      - name: Upload to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node scripts/upload.ts

      - name: Publish build report
        run: |
          {
            echo '### Catalog build'
            node -e '
              const r = require("./dist/v1/report.json");
              console.log(`Generated ${r.generated_at}`);
              console.log("");
              for (const [k, v] of Object.entries(r.counts)) console.log(`- ${k}: ${v}`);
              if (r.problems.length) {
                console.log(""); console.log("| theme | status | detail |"); console.log("|---|---|---|");
                for (const p of r.problems) console.log(`| ${p.slug} | ${p.status} | ${(p.errors ?? [p.reason ?? `strikes ${p.strikes}`]).slice(0,2).join("<br>").replaceAll("|","\\|")} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            dist/v1/catalog.json
            dist/v1/catalog.min.json
            dist/v1/report.json
          retention-days: 14

      - name: Commit liveness state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'omarchy-themes-bot'
          git config user.email 'omarchy-themes-bot@users.noreply.github.com'
          git add state/
          git diff --cached --quiet || git commit -m 'chore: update liveness state [skip ci]'
          git push
