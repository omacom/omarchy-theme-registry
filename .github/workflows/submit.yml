name: Submission

# Issue-driven submissions: an issue from the "Submit a theme" form (label `submission`) is
# validated, gets a report comment, and — when green — a PR adding themes/<slug>.json.
# Commenting `/recheck` on the issue re-runs everything. Issues already `published` are left alone.
#
# Two jobs, so no write token is around while untrusted code is handled: `validate` clones the
# submitted repository and decodes its images with a read-only token and no stored credentials,
# then hands its result to `publish`, which comments, labels and opens the PR. When `validate`
# crashes (rate limit, clone timeout) `publish` says so on the issue instead.
#
# The submission PR deliberately runs no checks: submit.ts below has already validated the theme
# and the branch is only pushed when it passes, so validate-pr.yml no longer watches `themes/`.
# SUBMIT_TOKEN (a GitHub App or fine-grained PAT with contents/issues/pull-requests write) is used
# when set; with the default GITHUB_TOKEN the PR is still opened.

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  validate:
    # Job-level, so only runs that pass the `if` join the group: a plain comment on the issue
    # (or the bot's own report comment) must not cancel a validation in progress.
    concurrency:
      group: submission-${{ github.event.issue.number }}
      cancel-in-progress: true
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      !contains(github.event.issue.labels.*.name, 'theme-broken') &&
      !contains(github.event.issue.labels.*.name, 'published') &&
      !github.event.issue.pull_request &&
      (
        github.event_name == 'issues' ||
        (
          startsWith(github.event.comment.body, '/recheck') &&
          (
            github.event.comment.user.login == github.event.issue.user.login ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # open submit/<slug> PRs claim their slugs
    outputs:
      ok: ${{ steps.validate.outputs.ok }}
      slug: ${{ steps.validate.outputs.slug }}
      name: ${{ steps.validate.outputs.name }}
      repo: ${{ steps.validate.outputs.repo }}
      owner: ${{ steps.validate.outputs.owner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate submission
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SUBMITTER: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$ISSUE_BODY" > body.md
          node scripts/submit.ts --issue-body-file body.md --submitted-by "$SUBMITTER" --write --json > result.json
          jq -r .markdown result.json > report.md
          {
            echo "ok=$(jq -r .ok result.json)"
            echo "slug=$(jq -r '.slug // empty' result.json)"
            echo "name=$(jq -r '.name // empty' result.json)"
            echo "repo=$(jq -r '.repo // empty' result.json)"
            echo "owner=$(jq -r .owner_verified result.json)"
          } >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: submission
          path: |
            report.md
            themes/${{ steps.validate.outputs.slug }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'failure')
    concurrency:
      group: submission-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.SUBMIT_TOKEN || secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      SUBMITTER: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Report a crash
        if: needs.validate.result == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Validation could not finish ([run log]($RUN_URL)). This is a problem on our side, not with your theme: GitHub may be rate limiting us, or the repository took too long to clone. Comment \`/recheck\` to try again in a while."
          exit 1

      - uses: actions/download-artifact@v7
        with:
          name: submission

      - name: Ensure labels exist
        run: |
          gh label create submission    --color 0e8a16 --description 'Theme submission from the issue form' --force
          gh label create validated     --color 0e8a16 --description 'Validation passed; PR opened' --force
          gh label create needs-changes --color d93f0b --description 'Validation failed; author must fix the repo' --force
          gh label create auto-approve  --color 5319e7 --description 'Submitter owns the repo; safe to merge on green' --force
          gh label create published     --color 1d76db --description 'Merged and in the catalog' --force

      - name: Report on the issue
        run: |
          {
            echo '<!-- omarchy-themes-submission -->'
            cat report.md
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md

      - name: Label as needs-changes
        if: needs.validate.outputs.ok != 'true'
        run: gh issue edit "$ISSUE" --remove-label validated,auto-approve --add-label needs-changes

      - name: Open or update the pull request
        if: needs.validate.outputs.ok == 'true'
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          NAME: ${{ needs.validate.outputs.name }}
          REPO: ${{ needs.validate.outputs.repo }}
          OWNER: ${{ needs.validate.outputs.owner }}
        run: |
          git config user.name 'omarchy-themes-bot'
          git config user.email 'omarchy-themes-bot@users.noreply.github.com'
          BRANCH="submit/$SLUG"
          git checkout -B "$BRANCH"
          git add themes/
          git commit -m "Add theme: $NAME ($SLUG)" -m "Submitted by @$SUBMITTER in #$ISSUE"
          git push --force origin "$BRANCH"

          {
            echo "Closes #$ISSUE"
            echo
            echo "Adds \`themes/$SLUG.json\` for \`$NAME\`, submitted by @$SUBMITTER."
            echo
            echo "**Theme repository:** [${REPO#https://github.com/}]($REPO)"
            echo
            if [ "$OWNER" = 'true' ]; then
              echo 'The submitter owns the repository.'
            else
              echo 'The submitter could not be verified as the repository owner; check before merging.'
            fi
            echo
            cat report.md
          } > pr.md

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file pr.md
            gh pr comment "$PR" --body 'Re-validated after `/recheck`; the branch and description were updated.'
          else
            PR=$(gh pr create --head "$BRANCH" --base master --title "Add theme: $NAME ($SLUG)" --body-file pr.md --label submission | grep -oE '[0-9]+$')
            gh issue comment "$ISSUE" --body "Pull request opened: #$PR. A maintainer will merge it and your theme goes live with the next catalog build."
          fi

          if [ "$OWNER" = 'true' ]; then
            gh pr edit "$PR" --add-label auto-approve
            gh issue edit "$ISSUE" --remove-label needs-changes --add-label validated,auto-approve
          else
            gh pr edit "$PR" --remove-label auto-approve
            gh issue edit "$ISSUE" --remove-label needs-changes,auto-approve --add-label validated
          fi
